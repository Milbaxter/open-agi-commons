name: Update leaderboard
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - registry.json
      - scripts/update_leaderboard.py
      - .github/workflows/leaderboard.yml
permissions:
  contents: read
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read merged PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_leaderboard.py
      - run: make check
      - name: Commit complete snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LEADERBOARD.md data/leaderboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update contributor leaderboard'
          git push origin HEAD:main
